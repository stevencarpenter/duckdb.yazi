name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release-page:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # Skip when the release page already exists, for example after a manual release.
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
