name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Lua and Luacheck
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.4"

      - uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce # v6.1.1

      - name: Run luacheck
        run: |
          luarocks install luacheck
          luacheck --no-color -q main.lua

  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # DuckDB 2.0 renamed the CLI release asset from duckdb_cli-*.zip to duckdb-cli-*.tar.gz.
        include:
          - version: "1.5.0"
            asset: duckdb_cli-linux-amd64.zip
          - version: "1.5.6"
            asset: duckdb_cli-linux-amd64.zip
          - version: "2.0.0"
            asset: duckdb-cli-linux-amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install DuckDB CLI ${{ matrix.version }}
        run: |
          curl -fsSL -o "${{ matrix.asset }}" \
            "https://github.com/duckdb/duckdb/releases/download/v${{ matrix.version }}/${{ matrix.asset }}"
          case "${{ matrix.asset }}" in
            *.zip) unzip -q "${{ matrix.asset }}" ;;
            *) tar -xzf "${{ matrix.asset }}" ;;
          esac
          chmod +x duckdb
          sudo mv duckdb /usr/local/bin/

      - name: Run smoke tests
        run: ./scripts/smoke-test.sh

      - name: Install Lua
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.4"

      - name: Run peek tests
        run: lua tests/peek_test.lua
